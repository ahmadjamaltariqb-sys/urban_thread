backend:
  name: github
  repo: ahmadjamaltariqb-sys/urban_thread
  branch: main

# Media folder for uploaded product images
media_folder: "images"
public_folder: "images"

collections:
  - name: "catalog"
    label: "Store Catalog"
    files:
      - name: "products_data"
        label: "All Products"
        file: "data/products.json"
        description: "Manage catalog products, prices, images, descriptions, and color swatches"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Product ID (e.g. p1, p2)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Price / Value", name: "pricePKR", widget: "number", value_type: "int" }
              - { label: "Rating / Certification", name: "rating", widget: "string" }
              - { label: "Badge Text", name: "badge", widget: "string", required: false }
              - { label: "Badge CSS Class", name: "badgeClass", widget: "string", required: false }
              - label: "Categories"
                name: "category"
                widget: "select"
                multiple: true
                options: ["men", "women", "casual", "accessories", "sale", "new", "export", "oem"]
              - { label: "Main Image", name: "image", widget: "image" }
              - { label: "Description", name: "desc", widget: "text" }
              - label: "Color Swatches"
                name: "swatches"
                widget: "list"
                required: false
                fields:
                  - { label: "Color Name", name: "name", widget: "string" }
                  - { label: "Color Hex (#hex)", name: "hex", widget: "string" }
                  - { label: "Color Image", name: "img", widget: "image" }

      - name: "store_settings"
        label: "Company Branding & Settings"
        file: "data/settings.json"
        description: "Manage company name, export announcement bar, WhatsApp number, and details"
        fields:
          - { label: "Company Name", name: "storeName", widget: "string" }
          - { label: "Tagline / Certifications", name: "storeTagline", widget: "string" }
          - { label: "Top Announcement Bar Text", name: "announcementText", widget: "text" }
          - { label: "WhatsApp Support Number", name: "whatsappNumber", widget: "string" }
          - { label: "Inquiries Email", name: "contactEmail", widget: "string" }
          - { label: "Factory / Office Address", name: "address", widget: "string" }
          - { label: "Hero Headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
